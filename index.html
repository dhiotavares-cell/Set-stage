<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SET • Stage v6</title>
<style>
:root{--bg:#0b0d10;--panel:#14181d;--panel2:#1b2027;--text:#f5f7fa;--muted:#9ca7b5;--line:#2a313a;--accent:#e9eef5;--warn:#ffd166}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);background:#0f1216;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:800;letter-spacing:.08em;font-size:18px}.sub{color:var(--muted);font-size:12px;margin-top:4px}
.section{margin-top:24px}.section h3{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px}
.song{width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--text);padding:11px 10px;border-radius:10px;cursor:pointer;margin-bottom:4px}
.song:hover,.song.active{background:var(--panel2);border-color:var(--line)}.song small{display:block;color:var(--muted);margin-top:3px}
main{padding:28px;max-width:1100px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
h1{font-size:34px;margin:0}.meta{color:var(--muted);margin-top:7px}.controls{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 12px;border-radius:10px;cursor:pointer}.btn:hover{background:var(--panel2)}
.grid{display:grid;grid-template-columns:1fr 310px;gap:18px;margin-top:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.map{display:flex;gap:7px;overflow:auto;padding-bottom:4px}
.map-tools{display:flex;justify-content:flex-end;margin-top:10px}
.map-editor-wrap{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.map-editor-wrap.open{display:block}
.map-editor{margin-top:0;display:grid;gap:8px}
.map-row{display:grid;grid-template-columns:40px minmax(0,1fr) 40px 40px 40px;gap:6px;align-items:center}
.map-row input{min-width:0}
.map-icon{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;height:40px;cursor:pointer}
.map-icon:disabled{opacity:.3;cursor:default}
.map-add{margin-top:4px}
.stage .map-editor{display:none!important}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel2);padding:7px 9px;border-radius:8px;font-size:12px}
textarea{width:100%;min-height:520px;resize:vertical;background:#0d1014;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:16px;line-height:1.75;font-family:"SFMono-Regular",Consolas,monospace;font-size:16px}
.notes textarea{min-height:210px;font-family:inherit;line-height:1.5}.field{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
input{width:100%;background:#0d1014;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px}.label{font-size:11px;color:var(--muted);margin-bottom:4px}
.notice{color:var(--muted);font-size:12px;line-height:1.45;margin-top:10px}
.chord-tools{display:flex;justify-content:flex-end;margin-top:10px}
.chord-diagrams{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.chord-diagrams.open{display:grid}
.chord-box{background:#0d1014;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.chord-name{font-weight:700;margin-bottom:7px}
.chord-svg{width:100%;max-width:105px;height:auto}
.chart-view{white-space:pre-wrap;background:#0d1014;border:1px solid var(--line);border-radius:10px;padding:16px;line-height:1.72;font-family:"SFMono-Regular",Consolas,monospace;font-size:18px;min-height:520px;overflow:auto}
.chart-view .section-label{display:inline-block;color:var(--warn);font-weight:800;margin:10px 0 4px}
.chart-actions{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.chart-actions .left,.chart-actions .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stage .chart-actions{display:none!important}
.stage .chart-view{
  border:0;background:transparent;height:calc(100vh - 175px);min-height:0;
  font-size:clamp(18px,1.65vw,27px);padding:12px 0 75px;
  column-width:420px;column-gap:54px;column-fill:auto;
  overflow-x:auto;overflow-y:hidden;white-space:pre-wrap;
  scroll-snap-type:x proximity;
}
.stage .chart-view .section-label{break-after:avoid;break-inside:avoid;column-break-after:avoid}
.stage main{overflow:hidden}
@media(max-width:700px){
  .stage .chart-view{
    height:calc(100vh - 155px);
    column-width:calc(100vw - 44px);
    column-gap:28px;
    font-size:18px;
  }
}
.stage #chart{display:none!important}
.stage-exit{display:none}
.stage .stage-exit{display:block;position:fixed;right:18px;top:18px;z-index:30}
.badge{display:inline-block;border:1px solid var(--line);background:var(--panel2);padding:5px 8px;border-radius:999px;font-size:12px;color:var(--muted)}
.stage .chord-tools,.stage .chord-diagrams{display:none!important}.stage aside,.stage .rightcol,.stage .editor-title,.stage .editonly{display:none!important}.stage .app{display:block}.stage main{max-width:none;padding:3vw 5vw}.stage .grid{display:block}.stage textarea{border:0;background:transparent;min-height:70vh;font-size:clamp(20px,2.2vw,34px);padding:12px 0}.stage h1{font-size:clamp(30px,4vw,54px)}
.stage .card{border:0;background:transparent;padding:0}.stage .map{margin:18px 0}.stage .chip{font-size:16px}
.stage-nav{display:none}
.stage .stage-nav{display:flex;position:fixed;left:0;right:0;bottom:18px;justify-content:space-between;pointer-events:none;padding:0 18px;z-index:20}
.stage .stage-arrow{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:rgba(20,24,29,.92);color:var(--text);font-size:28px;cursor:pointer}
.stage .stage-arrow:disabled{opacity:.25;cursor:default}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:18px}.grid{grid-template-columns:1fr}.top{flex-direction:column}textarea{min-height:430px}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand">SET • STAGE</div>
  <div class="sub">Congresso · repertório do culto</div>
  <div id="setlist"></div>
</aside>
<main>
  <div class="top">
    <div><h1 id="title"></h1><div class="meta" id="meta"></div></div>
    <div class="controls">
      <button class="btn" onclick="transpose(-1)">♭ Tom −</button>
      <button class="btn" onclick="transpose(1)">♯ Tom +</button>
      <button class="btn" onclick="restoreOriginal()">Tom original</button>
      <button class="btn" onclick="save()">Salvar</button>
      <button class="btn" onclick="toggleStage()">Modo palco</button>
      <button class="btn" id="refBtn" onclick="openRef()">▶ Referência</button>
    </div>
  </div>
  <div class="card" style="margin-top:18px">
    <h2>Mapa</h2>
    <div class="map" id="map"></div>

    <div class="map-tools editonly">
      <button class="btn" id="toggleMapEditorBtn" type="button">Editar mapa</button>
    </div>

    <div class="map-editor-wrap editonly" id="mapEditorWrap">
      <div class="map-editor" id="mapEditor"></div>
      <button class="btn map-add" id="addMapBtn" type="button">+ Adicionar seção</button>
    </div>
  </div>
  <div class="grid">
    <div class="card">
      <h2 class="editor-title">Cifra do set</h2>
      <div class="chart-actions editonly">
        <div class="left">
          <button class="btn" id="toggleChartEditBtn" type="button">Editar cifra</button>
          <span class="badge" id="chartStateBadge">Visualização</span>
        </div>
        <div class="right">
          <button class="btn" onclick="changeFont(-1)" type="button">A−</button>
          <button class="btn" onclick="changeFont(1)" type="button">A+</button>
        </div>
      </div>
      <div id="chartView" class="chart-view"></div>
      <textarea id="chart" spellcheck="false" style="display:none"></textarea>
      <div class="chord-tools editonly"><button class="btn" id="toggleChordBtn" type="button">Diagramas de acordes</button></div>
      <div class="chord-diagrams editonly" id="chordDiagrams"></div>
      <div class="notice editonly">Cifra do set: edite acordes, marcações, repetições e observações quando precisar. As alterações ficam salvas neste navegador.</div>
    </div>
    <div class="rightcol">
      <div class="card">
        <h2>Execução</h2>
        <div class="field"><div><div class="label">Tom</div><input id="key"></div><div><div class="label">Capo</div><input id="capo" type="number" min="0" max="11"></div></div>
        <div class="field"><div><div class="label">BPM</div><input id="bpm" type="number"></div><div><div class="label">Compasso</div><input id="meter"></div></div>
      </div>
      <div class="card notes" style="margin-top:18px"><h2>Combinados</h2><textarea id="notes"></textarea></div>
    </div>
  </div>
  <button class="btn stage-exit" onclick="toggleStage()">Sair do modo palco</button>
  <div class="stage-nav">
    <button class="stage-arrow" id="prevBtn" onclick="prevSong()" aria-label="Música anterior">←</button>
    <div style="display:flex;gap:10px;pointer-events:auto">
      <button class="stage-arrow" onclick="stageColumn(-1)" aria-label="Coluna anterior">‹</button>
      <button class="stage-arrow" onclick="stageColumn(1)" aria-label="Próxima coluna">›</button>
    </div>
    <button class="stage-arrow" id="nextBtn" onclick="nextSong()" aria-label="Próxima música">→</button>
  </div>
</main>
</div>

const chromatic=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const flatToSharp={"Db":"C#","Eb":"D#","Gb":"F#","Ab":"G#","Bb":"A#","Cb":"B","Fb":"E"};
const sharpToFlat={"C#":"Db","D#":"Eb","F#":"Gb","G#":"Ab","A#":"Bb"};

function splitKey(k){
  const m=(k||"").match(/^([A-G](?:#|b)?)(.*)$/);
  return m?[m[1],m[2]]:["",""];
}
function normRoot(root){return flatToSharp[root]||root}
function noteIndex(root){return chromatic.indexOf(normRoot(root))}
function preferFlats(key){return /b/.test(key||"")}
function shiftRoot(root,delta,flatPref=false){
  const idx=noteIndex(root);
  if(idx<0)return root;
  let r=chromatic[(idx+delta+120)%12];
  return flatPref?(sharpToFlat[r]||r):r;
}
function transposeChordToken(token,delta,flatPref=false){
  const m=token.match(/^([A-G](?:#|b)?)([^\/\s]*)(?:\/([A-G](?:#|b)?))?$/);
  if(!m)return token;
  return shiftRoot(m[1],delta,flatPref)+m[2]+(m[3]?"/"+shiftRoot(m[3],delta,flatPref):"");
}
function transposeText(text,delta,targetKey=""){
  const flatPref=preferFlats(targetKey);
  return text.replace(/(?<![A-Za-zÀ-ÿ])([A-G](?:#|b)?(?:m|maj|min|dim|aug|sus|add|M)?(?:\d+)?(?:\([^)]+\))?(?:\/[A-G](?:#|b)?)?)(?![A-Za-zÀ-ÿ])/g,
    m=>transposeChordToken(m,delta,flatPref));
}
function keyDelta(fromKey,toKey){
  const [aRoot]=splitKey(fromKey),[bRoot]=splitKey(toKey);
  const a=noteIndex(aRoot), b=noteIndex(bRoot);
  if(a<0||b<0)return 0;
  let d=(b-a+12)%12;if(d>6)d-=12;return d;
}

  const [root,suffix]=splitKey(soundKey);
  if(!root)return "";
  return shiftRoot(root,-(Number(capo)||0),preferFlats(soundKey))+suffix;
}
function effectiveChart(s){

  const baseShape=s.shapeKey || desiredShapeKey(s.originalKey,s.capo||0) || s.originalKey;
  const targetShape=desiredShapeKey(s.key,s.capo||0) || s.key;
  const delta=(baseShape&&targetShape)?keyDelta(baseShape,targetShape):0;
  return transposeText(s.originalChart ?? s.chart,delta,targetShape);
}

const chordShapes={
"C":["x","3","2","0","1","0"],"Cm":["x","3","5","5","4","3"],
"C#":["x","4","6","6","6","4"],"C#m":["x","4","6","6","5","4"],
"D":["x","x","0","2","3","2"],"Dm":["x","x","0","2","3","1"],
"D#":["x","6","8","8","8","6"],"D#m":["x","6","8","8","7","6"],
"E":["0","2","2","1","0","0"],"Em":["0","2","2","0","0","0"],
"F":["1","3","3","2","1","1"],"Fm":["1","3","3","1","1","1"],
"F#":["2","4","4","3","2","2"],"F#m":["2","4","4","2","2","2"],
"G":["3","2","0","0","0","3"],"Gm":["3","5","5","3","3","3"],
"G#":["4","6","6","5","4","4"],"G#m":["4","6","6","4","4","4"],
"A":["x","0","2","2","2","0"],"Am":["x","0","2","2","1","0"],

"B":["x","2","4","4","4","2"],"Bm":["x","2","4","4","3","2"]
};
function extractChords(text){
  const rx=/(?<![A-Za-zÀ-ÿ])([A-G](?:#|b)?(?:m|maj|min|dim|aug|sus|add|M)?(?:\d+)?(?:\([^)]+\))?(?:\/[A-G](?:#|b)?)?)(?![A-Za-zÀ-ÿ])/g;
  const found=[];let m;
  while((m=rx.exec(text))!==null){if(!found.includes(m[1]))found.push(m[1]);}
  return found;
}
function baseDiagramChord(c){
  const rootMatch=c.match(/^([A-G](?:#|b)?)(m?)/);
  if(!rootMatch)return null;
  let root=normRoot(rootMatch[1]), minor=rootMatch[2]==="m";
  return root+(minor?"m":"");
}
function chordSVG(shape){
  const xs=[18,32,46,60,74,88],y0=22,fret=16;let svg=`<svg class="chord-svg" viewBox="0 0 106 112" aria-hidden="true">`;
  for(let i=0;i<6;i++)svg+=`<line x1="${xs[i]}" y1="${y0}" x2="${xs[i]}" y2="${y0+5*fret}" stroke="currentColor" stroke-width="1"/>`;
  for(let i=0;i<=5;i++)svg+=`<line x1="${xs[0]}" y1="${y0+i*fret}" x2="${xs[5]}" y2="${y0+i*fret}" stroke="currentColor" stroke-width="${i===0?2:1}"/>`;
  shape.forEach((v,i)=>{if(v==="x")svg+=`<text x="${xs[i]}" y="13" text-anchor="middle" fill="currentColor" font-size="11">×</text>`;else if(v==="0")svg+=`<circle cx="${xs[i]}" cy="9" r="4" fill="none" stroke="currentColor" stroke-width="1.4"/>`;else{const f=Number(v),displayF=((f-1)%5)+1;svg+=`<circle cx="${xs[i]}" cy="${y0+(displayF-.5)*fret}" r="5" fill="currentColor"/>`;}});return svg+`</svg>`;
}
function renderChordDiagrams(){

    return `<div class="chord-box"><div class="chord-name">${c}</div>${shape?chordSVG(shape):'<div class="notice">Forma específica não cadastrada</div>'}</div>`;
